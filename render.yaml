services:
  - type: web
    name: glow-fix-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: cd server && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: glow-fix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: glow-fix-redis
          property: connectionString
      - key: NODE_ENV
        value: production

  - type: redis
    name: glow-fix-redis
    ipAllowList: []
    plan: free

databases:
  - name: glow-fix-db
    databaseName: glowfix
    user: glowfix
    plan: free
